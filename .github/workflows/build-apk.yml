name: Build FuRuan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android source
        run: unzip -o furuan-clicker-android-source.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Fix JVM target
        run: |
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          sed -i 's/jvmTarget = '\''1.8'\''/jvmTarget = '\''17'\''/g' app/build.gradle.kts
          cat app/build.gradle.kts

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: furuan-clicker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
